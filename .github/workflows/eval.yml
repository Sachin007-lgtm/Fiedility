name: Finsight Institutional CI Gate & Evaluation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-ci:
    name: Backend Tests & RAG Evaluation Gate
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Core Verification
        run: |
          cd backend
          python -m pytest tests/ -v

      - name: Run Golden Dataset RAG Evaluation & CI Gate
        run: |
          cd backend
          python -m evaluation.pipeline --dataset evaluation/golden_dataset.json --limit 10 --gate

      - name: Upload Evaluation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: backend/eval_report.json

  frontend-ci:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node Dependencies
        run: |
          cd frontend
          npm install

      - name: Run Typecheck & Production Build
        run: |
          cd frontend
          npm run build

